name: Build QMK firmware
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@main
    with:
      qmk_repo: qmk/qmk_firmware
      qmk_ref: master
      # helix_remix isn't in mainline QMK; stage it under qmk_firmware/keyboards
      # so qmk.path.is_keyboard() can find it.
      preparation_command: |
        cp -r keyboards/helix_remix qmk_firmware/keyboards/helix_remix

  publish:
    needs: build
    if: always() && !cancelled() && contains(needs.*.result, 'success')
    uses: qmk/.github/.github/workflows/qmk_userspace_publish.yml@main
